<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в личный кабинет</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h2>Вход в личный кабинет</h2>
        <span class="subtitle">Введите телефон и пароль</span>
        
        <form>
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" class="input-field">
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" class="input-field">
            </div>
            
            <div style="text-align: right; margin-bottom: 15px; font-size: 12px;">
                <a href="#" style="text-decoration: underline;">Забыли пароль?</a>
            </div>
            
            <button type="button" class="btn auth-btn"><a href="Личный кабинет.html">Войти</a></button>
        </form>
        
        <div class="auth-links">
            У вас еще нет аккаунта? <a href="Регистрация.html" style="text-decoration: underline;">Зарегистрируйтесь.</a>
        </div>
    </div>

</body>
</html>
