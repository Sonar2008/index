<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор тарифа - С ветерком</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="tariffs-page">

    <div class="tariffs-container">
        <h2>Выбор тарифа</h2>
        
        <div class="tariffs-grid">
            <!-- Эконом -->
            <div class="tariff-card">
                <h3 style="text-align: center;">Эконом</h3>
                <p style="font-size: 14px; color: #666; margin-top: 5px;">Описание</p>
                <hr style="border: 1px solid var(--color-pale-blue); margin: 10px 0;">
                <div class="tariff-price">
                    <span>Цена</span>
                    <span>₽</span>
                </div>
                <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&q=80&w=300&h=150" alt="Эконом">
                <button class="btn"><a href="Личный кабинет.html">Заказать</a></button>
            </div>

            <!-- Комфорт -->
            <div class="tariff-card">
                <h3 style="text-align: center;">Комфорт</h3>
                <p style="font-size: 14px; color: #666; margin-top: 5px;">Описание</p>
                <hr style="border: 1px solid var(--color-pale-blue); margin: 10px 0;">
                <div class="tariff-price">
                    <span>Цена</span>
                    <span>₽</span>
                </div>
                <img src="https://images.unsplash.com/photo-1550355291-bbee04a92027?auto=format&fit=crop&q=80&w=300&h=150" alt="Комфорт">
                <button class="btn"><a href="Личный кабинет.html">Заказать</a></button>
            </div>

            <!-- Бизнес -->
            <div class="tariff-card">
                <h3 style="text-align: center;">Бизнес</h3>
                <p style="font-size: 14px; color: #666; margin-top: 5px;">Описание</p>
                <hr style="border: 1px solid var(--color-pale-blue); margin: 10px 0;">
                <div class="tariff-price">
                    <span>Цена</span>
                    <span>₽</span>
                </div>
                <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=300&h=150" alt="Бизнес">
                <button class="btn"><a href="Личный кабинет.html">Заказать</a></button>
            </div>
        </div>
    </div>

</body>
</html>
