<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - С ветерком</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h2>Регистрация</h2>
        <span class="subtitle">Создайте аккаунт за минуту</span>
        
        <form>
            <div class="form-row">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" class="input-field">
                </div>
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" class="input-field">
                </div>
            </div>
            
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" class="input-field">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" class="input-field">
                </div>
                <div class="form-group">
                    <label>Повтор пароля</label>
                    <input type="password" class="input-field">
                </div>
            </div>
            
            <label class="checkbox-group">
                <input type="checkbox" checked>
                Я согласен с условиями обработки персональных данных
            </label>
            
            <button type="button" class="btn auth-btn"><a href="index.html">Зарегистрироваться</a></button>
        </form>
        
        <div class="auth-links">
            Уже есть аккаунт? <a href="Вход в личный кабинет.html" style="text-decoration: underline;">Войти</a>
        </div>
    </div>

</body>
</html>
