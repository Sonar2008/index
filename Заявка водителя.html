<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка водителя - С ветерком</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="driver-form-page">

    <div class="driver-form-container">
        <!-- Левая часть с фото -->
        <img src="аватарка.png" alt="Водитель" class="driver-img">
        
        <!-- Правая часть с формой -->
        <div class="driver-form-content">
            <form>
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" class="input-field">
                </div>
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" class="input-field">
                </div>
                <div class="form-group">
                    <label>Номер телефона</label>
                    <input type="tel" class="input-field">
                </div>
                <div class="form-group">
                    <label>Ваш город</label>
                    <input type="text" class="input-field">
                </div>
                <div class="form-group">
                    <label>Дата рождения</label>
                    <input type="date" class="input-field">
                </div>
                <div class="form-group">
                    <label>Дата выдачи ВУ</label>
                    <input type="date" class="input-field">
                </div>
                <div class="form-group">
                    <label>Серия и номер ВУ</label>
                    <input type="text" class="input-field">
                </div>
                
                <label class="checkbox-group">
                    <input type="checkbox">
                    Буду работать на своем авто
                </label>
                
                <button type="button" class="btn" style="width: 100%;"> <a href="index(1).html">Отправить заявку</a></button>
            </form>
        </div>
    </div>

</body>
</html>
