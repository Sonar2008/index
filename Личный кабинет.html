<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - С ветерком</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="dashboard-page">

    <div class="container">
        <div class="dashboard-header">
            <h2>Личный кабинет</h2>
            <button class="btn" style="background: #ffffff; color:#000000;"><a href="Вход в личный кабинет.html">Выйти из аккаунта</a> </button>
        </div>

        <div class="dashboard-grid">
            <!-- Левая колонка -->
            <div class="card profile-info">
                <h3 style="margin-bottom: 20px;">Личные данные</h3>
                <div class="info-row">
                    <span>Имя</span>
                    <span>Иван</span>
                </div>
                <div class="info-row">
                    <span>Фамилия</span>
                    <span>Иванов</span>
                </div>
                <div class="info-row">
                    <span>Телефон</span>
                    <span>+7(927)123-45-67</span>
                </div>
                <div class="info-row">
                    <span>Поездок</span>
                    <span>42</span>
                </div>
                <div class="info-row">
                    <span><button class="btn" ><a href="index.html"> На главную</a> </button></span>
                </div>
            </div>

            <!-- Правая колонка -->
            <div class="card">
                <h3 style="text-align: center; margin-bottom: 20px;">Активные заказы</h3>
                
                <div class="active-order">
                    <div class="order-header">
                        <strong>Заказ №10458</strong>
                        <span class="order-status">Выполняется</span>
                    </div>
                    <div class="order-details">
                        <div>Адрес: ул. Ленина, 14</div>
                        <div>Назначение: аэропорт Курумоч</div>
                        <div>Дата: 20.08.2026</div>
                        <div>Время: 08:15</div>
                    </div>
                    <div style="text-align: center;">
                        <button class="btn" style="background: #364C6B;">Управление заказом</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
