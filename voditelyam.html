<!-- ============================ ШАПКА ============================ -->
<header class="drv-header">
  <div class="drv-header-inner">
    <span class="drv-header-name">Водителям</span>
  </div>
</header>

<!-- ========================= ПЕРВЫЙ ЭКРАН ========================= -->
<section class="drv-hero">
  <div class="drv-hero-inner">

    <div class="drv-hero-left">
      <!-- <input class="drv-input" type="text" aria-label="Ваше имя"> -->
      <h1 class="drv-title">Работа в такси<br>с партнёрами<br>С ветерком</h1>
      <a class="btn drv-btn" href="Заявка водителя.html">Оставьте заявку</a>
    </div>

    <img class="drv-photo" src="мужик.png" alt="Водитель такси за работой">

  </div>
</section>

<!-- ========================= ПРЕИМУЩЕСТВА ========================= -->
<section class="drv-advantages">

  <h2 class="drv-adv-title">
    <span class="drv-adv-line drv-adv-line-1">Будьте водителем</span>
    <span class="drv-adv-line drv-adv-line-2">в свободное время</span>
  </h2>

  <div class="drv-cards">

    <!-- Карточка 1: свой график -->
    <article class="drv-card drv-card-1">

      <p class="drv-card-1-text">Совмещайте<br>своё расписание<br>с любыми<br>делами</p>

      <div class="drv-calendar">
        <div class="drv-cells">
          <span class="drv-cell drv-cell-empty"></span>
          <span class="drv-cell"></span>
          <span class="drv-cell"></span>
          <span class="drv-cell"></span>

          <span class="drv-cell"></span>
          <span class="drv-cell drv-cell-blue">8</span>
          <span class="drv-cell"></span>
          <span class="drv-cell"></span>

          <span class="drv-cell"></span>
          <span class="drv-cell"></span>
          <span class="drv-cell"></span>
          <span class="drv-cell"></span>

          <span class="drv-cell drv-cell-blue">17</span>
          <span class="drv-cell"></span>
          <span class="drv-cell"></span>
          <span class="drv-cell"></span>
        </div>
      </div>

    </article>

    <!-- Карточка 2: доход -->
    <article class="drv-card drv-card-2">

      <div class="drv-deco2">
        <svg class="drv-ruble" width="185.14" height="185.14">
          <use href="#drv-ruble"/>
        </svg>
        <svg class="drv-bolt" width="66.3" height="108.1">
          <use href="#drv-bolt"/>
        </svg>
      </div>

      <p class="drv-card-2-text">Доход на то, что вам нужно</p>

    </article>

    <!-- Карточка 3: бонусы -->
    <article class="drv-card drv-card-3">

      <p class="drv-card-3-text">Получайте больше<br>с системой бонусов<br>для партнёров<br>и персональных целей</p>

      <div class="drv-checks">
        <svg class="drv-check drv-check-1" width="42.84" height="42.84">
          <use href="#drv-check"/>
        </svg>
        <svg class="drv-check drv-check-2" width="42.84" height="42.84">
          <use href="#drv-check"/>
        </svg>
        <svg class="drv-check drv-check-3" width="42.84" height="42.84">
          <use href="#drv-check"/>
        </svg>
      </div>

    </article>

  </div>

</section>

</body>
</html>
